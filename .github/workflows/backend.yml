name: Backend

on:
  push:
    paths: ['web/**', 'api/**', 'worker/**', 'infra/**', 'docs/openapi.yaml', 'tools/structsim/**', 'tools/aicode/**', '.dockerignore', '.github/workflows/backend.yml']
  pull_request:
    paths: ['web/**', 'api/**', 'worker/**', 'infra/**', 'docs/openapi.yaml', 'tools/structsim/**', 'tools/aicode/**', '.dockerignore', '.github/workflows/backend.yml']

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AI_BUILD_TARGET: ai-mock-worker
      AI_ENGINE: mock
      AI_METHOD_VERSION: aicode-mock/1
      MAINTENANCE_INTERVAL: PT2S
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            worker/requirements.txt
            infra/requirements.txt
      - run: mvn -f api/pom.xml test -B
      - run: pip install -r worker/requirements.txt -r infra/requirements.txt pytest -e tools/structsim
      - run: python -m unittest discover -s worker/core/tests -v
      - run: python -m unittest discover -s worker/ai/tests -v
      - run: cargo test --release --locked --manifest-path tools/structsim/native/Cargo.toml
      - run: cargo build --release --locked --manifest-path tools/structsim/native/Cargo.toml
      - run: python -m pytest tools/structsim/tests -c tools/structsim/pyproject.toml
      - run: docker compose -p integritylens-ci -f infra/docker-compose.yml up --build -d --wait --wait-timeout 180
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Browser E2E against the Compose stack
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e
          path: |
            web/test-results/
            web/playwright-report/
      - run: python infra/smoke_test.py
      - run: python infra/smoke_partial_test.py
      - run: |
          AI_MOCK_SCENARIO=partial docker compose -p integritylens-ci -f infra/docker-compose.yml \
            up -d --no-deps --wait worker-ai
          python infra/smoke_test.py --expect-ai-failure
      - run: |
          docker compose -p integritylens-ci -f infra/docker-compose.yml stop worker-ai worker-structsim
          docker compose -p integritylens-ci -f infra/docker-compose.yml run --rm --no-deps worker-structsim \
            python -m unittest discover -s worker/tests -v
      - if: failure()
        run: docker compose -p integritylens-ci -f infra/docker-compose.yml logs --tail 100 api worker-structsim worker-ai
      - if: always()
        run: docker compose -p integritylens-ci -f infra/docker-compose.yml down -v

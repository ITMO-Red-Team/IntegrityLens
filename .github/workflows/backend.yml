name: Backend

on:
  push:
    paths: ['api/**', 'worker/**', 'infra/**', '.dockerignore', '.github/workflows/backend.yml']
  pull_request:
    paths: ['api/**', 'worker/**', 'infra/**', '.dockerignore', '.github/workflows/backend.yml']

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - run: mvn -f api/pom.xml test -B
      - run: pip install -r worker/requirements.txt
      - run: python -m unittest discover -s worker/core/tests -v
      - run: docker compose -p integritylens-ci -f infra/docker-compose.yml up --build -d --wait --wait-timeout 180
      - run: python infra/smoke_test.py
      - run: python infra/export_openapi.py --check
      - run: |
          docker compose -p integritylens-ci -f infra/docker-compose.yml stop worker-jplag worker-structsim
          docker compose -p integritylens-ci -f infra/docker-compose.yml run --rm --no-deps worker-jplag \
            python -m unittest discover -s worker/tests -v
      - if: failure()
        run: docker compose -p integritylens-ci -f infra/docker-compose.yml logs --tail 100 api worker-jplag worker-structsim
      - if: always()
        run: docker compose -p integritylens-ci -f infra/docker-compose.yml down -v

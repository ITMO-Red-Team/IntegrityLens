
name: web

on:
  push:
    paths:
      - "web/**"
      - "api/openapi.yaml"
      - "docs/openapi.yaml"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - "api/openapi.yaml"
      - "docs/openapi.yaml"
      - ".github/workflows/web.yml"

defaults:
  run:
    working-directory: web

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Установка зависимостей
        run: npm ci

      - name: Проверка текущего API-контракта
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.ts

      - name: Проверка нового API-контракта
        run: |
          npm run gen:api:target
          git diff --exit-code -- src/api/target/schema.ts

      - name: Проверка типов
        run: npm run typecheck

      - name: Тесты
        run: |
          npm test -- --reporter=default --reporter=junit --outputFile.junit=reports/junit.xml

      - name: Сборка
        run: npm run build

      - name: Сборка Docker-образа
        run: docker build -t integritylens-web:ci .

      - name: Сохранить результаты тестов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-test-reports
          path: web/reports/

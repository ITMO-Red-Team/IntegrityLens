spring:
  application:
    name: integritylens-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/integritylens}
    username: ${POSTGRES_USER:integritylens}
    password: ${POSTGRES_PASSWORD:integritylens-local}
  servlet:
    multipart:
      resolve-lazily: true
      max-file-size: 1000000B
      max-request-size: 1100000B
  jackson:
    default-property-inclusion: always
server:
  tomcat:
    max-swallow-size: -1
logging:
  structured:
    format:
      console: logstash
integritylens:
  public-base-url: ${INTEGRITYLENS_PUBLIC_BASE_URL:http://localhost:3000}
  maintenance-interval: ${MAINTENANCE_INTERVAL:PT1M}
  analysis:
    structsim-version: ${STRUCTSIM_METHOD_VERSION:structsim-0.3.0+semgrep-1.180.0+core2+templates-f1a1796c}
    ai-version: ${AI_METHOD_VERSION:aicode-0.1.1+gigacheck-9fabe1503f+int2}
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    access-key: ${S3_ACCESS_KEY:integritylens}
    secret-key: ${S3_SECRET_KEY:integritylens-local}
    bucket: ${S3_BUCKET:integritylens}
springdoc:
  paths-to-match: /api/**
  swagger-ui:
    url: /openapi.yaml
    disable-swagger-default-url: true

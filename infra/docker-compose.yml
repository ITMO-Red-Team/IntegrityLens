name: integritylens-v2

x-worker-env: &worker-env
  PGHOST: postgres
  PGDATABASE: integritylens
  PGUSER: ${POSTGRES_USER:-integritylens}
  PGPASSWORD: ${POSTGRES_PASSWORD:-integritylens-local}
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-integritylens}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-integritylens-local}
  S3_BUCKET: integritylens
  MOCK_DELAY_SECONDS: ${MOCK_DELAY_SECONDS:-0}

x-worker: &worker
  init: true
  depends_on:
    api:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: integritylens
      POSTGRES_USER: ${POSTGRES_USER:-integritylens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-integritylens-local}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d integritylens']
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    command: server /data --console-address :9001 --json
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-integritylens}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-integritylens-local}
    volumes:
      - minio-data:/data

  minio-init:
    image: integritylens-worker-base:0.3.0
    build:
      context: ..
      dockerfile: worker/Dockerfile
      target: base
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-integritylens}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-integritylens-local}
    depends_on:
      minio:
        condition: service_started
    command: [python, -m, worker.init_storage]

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
      args:
        JAVA_BUILD_OPTS: ${JAVA_BUILD_OPTS:-}
        APT_MIRROR: ${APT_MIRROR:-}
    environment:
      JAVA_TOOL_OPTIONS: ${API_JAVA_OPTS:-}
      DATABASE_URL: jdbc:postgresql://postgres:5432/integritylens
      POSTGRES_USER: ${POSTGRES_USER:-integritylens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-integritylens-local}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-integritylens}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-integritylens-local}
      INTEGRITYLENS_PUBLIC_BASE_URL: ${INTEGRITYLENS_PUBLIC_BASE_URL:-http://localhost:3000}
      MAINTENANCE_INTERVAL: ${MAINTENANCE_INTERVAL:-PT1M}
      STRUCTSIM_METHOD_VERSION: ${STRUCTSIM_METHOD_VERSION:-structsim-0.2.0+semgrep-1.180.0+core2+templates-f1a1796c}
      AI_METHOD_VERSION: ${AI_METHOD_VERSION:-aicode-0.1.1+gigacheck-9fabe1503f+int2}
    ports:
      - '${API_BIND:-127.0.0.1}:${API_PORT:-8080}:8080'
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://localhost:8080/api/health > /dev/null']
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 20
    restart: unless-stopped

  worker-structsim:
    <<: *worker
    build:
      context: ..
      dockerfile: worker/Dockerfile
      target: ${STRUCTSIM_BUILD_TARGET:-structsim}
    environment:
      <<: *worker-env
      WORKER_METHOD: structsim
      WORKER_METHOD_VERSION: ${STRUCTSIM_METHOD_VERSION:-structsim-0.2.0+semgrep-1.180.0+core2+templates-f1a1796c}
      CORE_ENGINE: ${STRUCTSIM_ENGINE:-real}
      MOCK_SCENARIO: ${STRUCTSIM_MOCK_SCENARIO:-success}

  worker-ai:
    <<: *worker
    build:
      context: ..
      dockerfile: worker/ai.Dockerfile
      target: ${AI_BUILD_TARGET:-ai-worker}
      args:
        AICODE_MODEL_URL: ${AICODE_MODEL_URL:-https://github.com/ITMO-Red-Team/IntegrityLens/releases/download/aicode-model-v0.1.0/gigacheck-int2.zip}
        AICODE_MODEL_SHA256: ${AICODE_MODEL_SHA256:-afd7277e650d08055c6deca54375dabc8423cdc289405b9c08343058a750c28c}
    environment:
      <<: *worker-env
      WORKER_METHOD: ai
      WORKER_METHOD_VERSION: ${AI_METHOD_VERSION:-aicode-0.1.1+gigacheck-9fabe1503f+int2}
      CORE_ENGINE: ${AI_ENGINE:-real}
      MOCK_SCENARIO: ${AI_MOCK_SCENARIO:-success}
      CORE_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-600}
      AICODE_THREADS: ${AICODE_THREADS:-4}

volumes:
  postgres-data:
  minio-data:

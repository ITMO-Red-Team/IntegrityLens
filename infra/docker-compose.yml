name: integritylens

x-worker: &worker
  image: integritylens-worker:0.1.0
  build:
    context: ..
    dockerfile: worker/Dockerfile
  environment: &worker-env
    DATABASE_URL: postgresql://${POSTGRES_USER:-integritylens}:${POSTGRES_PASSWORD:-integritylens-local}@postgres:5432/integritylens
    S3_ENDPOINT: http://minio:9000
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:-integritylens}
    S3_SECRET_KEY: ${S3_SECRET_KEY:-integritylens-local}
    S3_BUCKET: integritylens
    MOCK_DELAY_SECONDS: ${MOCK_DELAY_SECONDS:-2}
    MOCK_SCENARIO: ${MOCK_SCENARIO:-success}
  depends_on:
    api:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: integritylens
      POSTGRES_USER: ${POSTGRES_USER:-integritylens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-integritylens-local}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d integritylens']
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    command: server /data --console-address :9001 --json
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-integritylens}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-integritylens-local}
    volumes:
      - minio-data:/data

  minio-init:
    image: integritylens-worker:0.1.0
    build:
      context: ..
      dockerfile: worker/Dockerfile
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-integritylens}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-integritylens-local}
    depends_on:
      minio:
        condition: service_started
    command: [python, -m, worker.init_storage]

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
      args:
        JAVA_BUILD_OPTS: ${JAVA_BUILD_OPTS:-}
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/integritylens
      POSTGRES_USER: ${POSTGRES_USER:-integritylens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-integritylens-local}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-integritylens}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-integritylens-local}
    ports:
      - '${API_PORT:-8080}:8080'
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://localhost:8080/api/health > /dev/null']
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 20
    restart: unless-stopped

  worker-jplag:
    <<: *worker
    environment:
      <<: *worker-env
      WORKER_METHOD: jplag

  worker-structsim:
    <<: *worker
    environment:
      <<: *worker-env
      WORKER_METHOD: structsim

    web:
      build: 
        context: ../web
        args:
          VITE_USE_MOCKS: "false"
      ports:
        - '${WEB_PORT:-3000}:80'
      depends_on:
        api:
          condition: service_healthy
      restart: unless-stopped

volumes:
  postgres-data:
  minio-data:

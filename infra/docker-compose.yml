name: integritylens

x-worker: &worker
  image: integritylens-worker:0.1.0
  build:
    context: ..
    dockerfile: worker/Dockerfile
  environment: &worker-env
    DATABASE_URL: postgresql://${POSTGRES_USER:-integritylens}:${POSTGRES_PASSWORD:-integritylens-local}@postgres:5432/integritylens
    S3_ENDPOINT: http://minio:9000
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:-integritylens}
    S3_SECRET_KEY: ${S3_SECRET_KEY:-integritylens-local}
    S3_BUCKET: integritylens
    MOCK_DELAY_SECONDS: ${MOCK_DELAY_SECONDS:-2}
    MOCK_SCENARIO: ${MOCK_SCENARIO:-success}
  depends_on:
    api:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: integritylens
      POSTGRES_USER: ${POSTGRES_USER:-integritylens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-integritylens-local}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d integritylens']
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-integritylens}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-integritylens-local}
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-integritylens}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-integritylens-local}
    depends_on:
      minio:
        condition: service_started
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        attempts=0
        until mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"; do
          attempts=$$((attempts + 1))
          [ "$$attempts" -lt 30 ] || exit 1
          sleep 2
        done
        mc mb --ignore-existing local/integritylens

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/integritylens
      POSTGRES_USER: ${POSTGRES_USER:-integritylens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-integritylens-local}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-integritylens}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-integritylens-local}
    ports:
      - '${API_PORT:-8080}:8080'
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://localhost:8080/api/health > /dev/null']
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 20
    restart: unless-stopped

  worker-jplag:
    <<: *worker
    environment:
      <<: *worker-env
      WORKER_METHOD: jplag

  worker-structsim:
    <<: *worker
    environment:
      <<: *worker-env
      WORKER_METHOD: structsim

volumes:
  postgres-data:
  minio-data:

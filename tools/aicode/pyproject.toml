[project]
name = "integritylens-aicode"
version = "0.1.1"
description = "Local CPU-based AI-generated code span detection"
requires-python = ">=3.11"
dependencies = [
    "accelerate==1.10.1",
    "dacite==1.9.2",
    "loguru==0.7.3",
    "numpy==2.2.5",
    "omegaconf==2.3.0",
    "optimum-quanto==0.2.7",
    "protobuf==5.29.5",
    "scipy==1.15.3",
    "sentencepiece==0.2.1",
    "setuptools==80.9.0",
    "torch==2.7.1",
    "transformers==4.55.0",
]

[project.scripts]
aicode = "aicode.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aicode"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

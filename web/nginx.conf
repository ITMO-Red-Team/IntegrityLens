server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; worker-src 'self'" always;

  resolver 127.0.0.11 valid=30s ipv6=off;
  location /api/ {
    set $api_upstream http://api:8000;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    client_max_body_size 11m;
  }

  location /assets/ {
    expires 1y;
  }

  location = /mockServiceWorker.js {
    expires -1;
  }

  location / {
    try_files $uri /index.html;
  }
}